# Dependabot was running against this repo with no config file checked in, which
# meant it was still maintaining a `cargo` group for the Rust embedding server —
# a sidecar deleted in the 2026-07 retirement. This file states explicitly what
# is actually shipped today.
#
# Everything targets Rawhide, not the default branch: `main` is tagged stable
# releases only, and dependency bumps are ordinary changes that belong on the
# rolling development branch like anything else.
#
# NOTE: a pub update that moves a package BACKWARDS will fail
# test/deps/dependency_floor_test.dart. That is intended — read the guard's
# header before touching test/deps/dependency_floors.json.

version: 2
updates:
  # Flutter / Dart packages
  - package-ecosystem: "pub"
    directory: "/"
    target-branch: "Rawhide"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One PR for the routine churn; majors still come through individually so
      # they get read properly.
      pub-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Web / mobile UI
  #
  # ── FROZEN 2026-08-05: ChainDrop npm supply-chain attack ────────────────
  # open-pull-requests-limit: 0 stops Dependabot opening npm PRs entirely. This
  # is deliberate and TEMPORARY. See docs/security/npm-freeze-2026-08.md for
  # the scan results, the thaw checklist, and who lifts it.
  #
  # Why freeze rather than patch: the protection we currently have is that this
  # lockfile pins versions published BEFORE the campaign, and none of the
  # affected packages are in the tree at all. Any bump resolves fresh artifacts
  # from a registry whose compromised-package list was still growing when this
  # was written (868 packages / 1381 versions reported, a wider count of 1300+
  # cited the same day). Pulling anything new trades a known-good tree for an
  # unaudited one — and web_ui's build output ships INSIDE the desktop app, so
  # a poisoned build dependency reaches end users, not just developers.
  #
  # The open advisories this defers are all low practical exposure for us:
  # react-router's CSRF bypass is RSC-mode only (this is a Vite SPA with no
  # server actions), and brace-expansion / fast-uri / postcss are build- and
  # test-time only, reachable solely from inputs we control.
  #
  # Restore `open-pull-requests-limit: 5` to thaw.
  - package-ecosystem: "npm"
    directory: "/web_ui"
    target-branch: "Rawhide"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps-web)"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # CI actions — these drift silently and break builds at the worst moment
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "Rawhide"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
